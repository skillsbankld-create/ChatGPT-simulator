<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="ChatGPT Simulation Lab: Watch, Try, Test, Practice and a scored work challenge, in English and Arabic."><style>html,body{margin:0;padding:0}*{box-sizing:border-box}</style>
<title>ChatGPT Simulation Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — chapter rail on the left, scaled 1280x800 replica in the middle, coach panel under it */
:root{
  --bg:#ECEAE4; --panel:#F8F7F3; --ink:#1D1C19; --muted:#6B6960; --line:#D9D6CC;
  --hot:#1F6FEB; --hot-soft:rgba(31,111,235,.16); --ok:#1F8A4C; --bad:#C2412D; --chip:#E3E0D7;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412; --panel:#1D1C1A; --ink:#EDEBE4; --muted:#A09D93; --line:#34322D;
  --hot:#4C8DFF; --hot-soft:rgba(76,141,255,.2); --ok:#3DBE73; --bad:#F06A52; --chip:#2B2A26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412; --panel:#1D1C1A; --ink:#EDEBE4; --muted:#A09D93; --line:#34322D;
  --hot:#4C8DFF; --hot-soft:rgba(76,141,255,.2); --ok:#3DBE73; --bad:#F06A52; --chip:#2B2A26; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
[lang="ar"],.ar{font-family:var(--f-ar)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1500px;margin:0 auto 12px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand b{font-family:var(--f-serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg svg{width:15px;height:15px}

/* ---------- workbench ---------- */
.wb{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;max-width:1500px;margin:0 auto;align-items:start}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.rail h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 8px 6px;font-weight:600}
.ch{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;width:100%;text-align:start;border:0;background:transparent;padding:8px;border-radius:9px}
.ch:hover{background:var(--chip)}
.ch[aria-current="true"]{background:var(--hot-soft)}
.ch .n{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted);font-variant-numeric:tabular-nums}
.ch[aria-current="true"] .n{background:var(--hot);color:#fff}
.ch .t{font-size:13px;line-height:1.3;min-width:0}
.ch .t small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.ch .st{display:flex;gap:3px}
.ch .st i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.ch .st i.on{background:var(--ok)}
.grp{font-size:11px;color:var(--muted);margin:12px 8px 4px;display:flex;gap:6px;align-items:center}
.grp:before{content:"";width:14px;height:1px;background:var(--line)}
.legend{font-size:11px;color:var(--muted);margin:10px 8px 4px;line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.stagewrap{position:relative;background:#0f0f0e;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.scaler{width:1280px;height:800px;transform-origin:0 0;position:absolute;left:0;top:0}
.ring{position:absolute;border:3px solid var(--hot);border-radius:10px;pointer-events:none;box-shadow:0 0 0 4000px rgba(10,12,20,.18),0 0 0 6px var(--hot-soft);transition:all .28s cubic-bezier(.3,.7,.3,1);z-index:5}
.ring.pulse{animation:pulse 1.4s ease-in-out infinite}
.ring.soft{box-shadow:0 0 0 6px var(--hot-soft)}
@keyframes pulse{50%{box-shadow:0 0 0 4000px rgba(10,12,20,.18),0 0 0 12px rgba(31,111,235,.06)}}
.bubble{position:absolute;z-index:6;max-width:300px;background:#11131a;color:#fff;border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.45;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .2s}
.bubble[dir="rtl"]{font-family:var(--f-ar)}
.flash{position:absolute;z-index:7;pointer-events:none;border-radius:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid var(--hot);animation:ripple .5s ease-out forwards}
.flash.bad{border-color:var(--bad)}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.stagewrap.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.done{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(15,15,14,.55);backdrop-filter:blur(3px)}
.done .card{background:var(--panel);color:var(--ink);border-radius:16px;padding:22px;width:min(440px,90%);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.done h2{font-family:var(--f-serif);font-weight:600;font-size:24px;margin:6px 0 6px;text-wrap:balance}
.done p{color:var(--muted);margin:0 0 14px;line-height:1.5}
.done .big{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--f-serif)}
.done .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.done .stats{display:flex;gap:18px;justify-content:center;margin:4px 0 16px;font-size:13px;color:var(--muted)}
.done .stats b{display:block;color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}

.coach{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.coach .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coach .k .mode{color:var(--hot);font-weight:600}
.coach h2{font-family:var(--f-serif);font-weight:600;font-size:21px;margin:6px 0 6px;line-height:1.25;text-wrap:balance}
.coach[dir="rtl"] h2,.coach[dir="rtl"] p{font-family:var(--f-ar)}
.coach p{margin:0;color:var(--ink);line-height:1.6;max-width:72ch;opacity:.86}
.coach .hint{margin-top:8px;color:var(--bad);font-weight:500}
.coach .note{margin-top:8px;color:var(--muted);font-size:12.5px}
.bar{height:4px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:12px;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--hot);transition:width .3s}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.b{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.b:hover{background:var(--chip)}
.b.pri{background:var(--hot);border-color:var(--hot);color:#fff}
.b.pri:hover{filter:brightness(1.08)}
.b[disabled]{opacity:.4;cursor:default}
.b svg{width:15px;height:15px}
.kbd{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0}
.mobile-pick{display:none}
@media (max-width:900px){
  .wb{grid-template-columns:1fr}
  .rail{display:none}
  .mobile-pick{display:block;width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
  .coach{grid-template-columns:1fr}
  .btns{justify-content:flex-start}
  .brand small{display:none}
}
/* full-screen mode: Claude fills the screen, coach becomes a side panel */
.fsb{white-space:nowrap}
body.fs{padding-block:8px}
body.fs .top{margin-bottom:8px;gap:8px}
body.fs .brand small, body.fs .tag{display:none}
body.fs .brand b{font-size:16px}
body.fs .top .mobile-pick{display:block;width:auto;max-width:280px;padding:7px 9px}
body.fs .wb{grid-template-columns:1fr;max-width:none}
body.fs .rail{display:none}
body.fs .main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;align-items:start}
body.fs .stagewrap{grid-column:1;grid-row:1}
body.fs .coach{grid-column:2;grid-row:1;grid-template-columns:1fr;overflow:auto;padding:14px}
body.fs .coach .btns{justify-content:flex-start}
body.fs .coach h2{font-size:18px}
body.fs.nocoach .main{grid-template-columns:minmax(0,1fr) 54px}
body.fs.nocoach .coach > div:first-child, body.fs.nocoach .coach .bar{display:none}
body.fs.nocoach .coach{padding:8px}
body.fs.nocoach .coach .btns{flex-direction:column;align-items:center}
body.fs.nocoach .coach .btns .b span{display:none}
.coach .cbt{display:none}
body.fs .coach .cbt{display:inline-flex}
@media (max-width:900px){ body.fs .main{grid-template-columns:1fr} body.fs .coach{grid-column:1;grid-row:2} }
@media (prefers-reduced-motion:reduce){.ring,.ring.pulse,.flash{animation:none;transition:none}}

/* ================= ChatGPT replica (fixed 1280x800, own palette) ================= */
.app{--g-bg:#212121;--g-side:#181818;--g-input:#303030;--g-ink:#ECECEC;--g-sub:#B4B4B4;--g-faint:#8E8E8E;--g-line:#3A3A3A;--g-hover:#2A2A2A;--g-sel:#2F2F2F;--g-menu:#353535;--g-acc:#E8702A;--g-bub:#B4511E;--g-bubfg:#FFF;--g-btn:#FFFFFF;--g-btnfg:#0D0D0D;--g-blue:#4E9CF5;--g-card:#2A2A2A;
  width:1280px;height:800px;background:var(--g-bg);color:var(--g-ink);font-family:"Inter",ui-sans-serif,-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;position:relative;overflow:hidden;display:flex;user-select:none;direction:ltr;text-align:left}
.app.light{--g-bg:#FFFFFF;--g-side:#F9F9F9;--g-input:#FFFFFF;--g-ink:#0D0D0D;--g-sub:#5D5D5D;--g-faint:#8F8F8F;--g-line:#E3E3E3;--g-hover:#EFEFEF;--g-sel:#ECECEC;--g-menu:#FFFFFF;--g-btn:#0D0D0D;--g-btnfg:#FFFFFF;--g-card:#F7F7F7}
.app.acc-green{--g-acc:#22A06B;--g-bub:#1E7F57}.app.acc-blue{--g-acc:#3B82F6;--g-bub:#2563EB}.app.acc-purple{--g-acc:#9B6BFF;--g-bub:#7445D9}.app.acc-pink{--g-acc:#E2559E;--g-bub:#C23B83}.app.acc-default{--g-acc:#ECECEC;--g-bub:#303030}
.app.light.acc-default{--g-acc:#0D0D0D;--g-bub:#F1F1F1;--g-bubfg:#0D0D0D}
.app svg{width:16px;height:16px;flex:none}
.app [data-hs]{cursor:pointer}
.ic{display:inline-flex;align-items:center;justify-content:center}
.gs{width:252px;background:var(--g-side);display:flex;flex-direction:column;padding:8px;gap:1px;flex:none}
.gs .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 12px;font-weight:600;font-size:16px}
.gs .hd span{display:flex;gap:12px;color:var(--g-sub)}
.gi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:14px;color:var(--g-ink)}
.gi:hover{background:var(--g-hover)}
.gi.on{background:var(--g-sel)}
.gi .ic{color:var(--g-ink)}
.gi .tagu{font-size:9.5px;letter-spacing:.04em;background:var(--g-sel);color:var(--g-sub);border-radius:5px;padding:2px 5px;margin-left:2px}
.gs .sh{font-size:13px;color:var(--g-faint);padding:16px 10px 6px}
.gs .rc{padding:7px 10px;border-radius:9px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center;gap:6px}
.gs .rc:hover{background:var(--g-hover)}
.gs .rc.on{background:var(--g-sel)}
.gs .rc .tt{overflow:hidden;text-overflow:ellipsis}
.gs .empty{font-size:12.5px;color:var(--g-faint);padding:4px 10px}
.gfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:6px 4px}
.gfoot .u{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px}
.gfoot .u:hover{background:var(--g-hover)}
.gav{width:28px;height:28px;border-radius:50%;background:#E5B521;flex:none}
.gfoot b{display:block;font-size:13.5px;font-weight:500}
.gfoot small{font-size:12px;color:var(--g-faint)}
.gclaim{display:flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--g-line);border-radius:999px;padding:8px;font-size:13px}
.gm{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
.gtop{height:52px;display:flex;align-items:center;padding:0 16px;gap:10px;position:relative;flex:none}
.gtop .mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;background:var(--g-input);border-radius:999px;padding:3px}
.gtop .mid span{padding:5px 16px;border-radius:999px;font-size:13.5px;color:var(--g-sub)}
.gtop .mid span.on{background:var(--g-sel);color:var(--g-ink)}
.gtop .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.gtop .offer{color:var(--g-blue);display:flex;gap:6px;align-items:center;font-size:13.5px}
.gtop .ttl{font-size:16px;display:flex;gap:6px;align-items:center}
.gbtn{border:1px solid var(--g-line);border-radius:999px;padding:7px 14px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;background:transparent;color:var(--g-ink)}
.gbtn.pri{background:var(--g-btn);color:var(--g-btnfg);border-color:var(--g-btn)}
.gbtn.sm{padding:5px 11px;font-size:12.5px}
.gbtn.red{color:#F26262;border-color:#5a2a2a}
.gcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:70px;gap:26px}
.gh1{font-size:28px;font-weight:500;letter-spacing:-.01em}
.gcomp{width:740px;background:var(--g-input);border-radius:28px;padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:0 0 0 1px var(--g-line) inset}
.gcomp.focus{box-shadow:0 0 0 1.5px var(--g-faint) inset}
.gcomp .tx{font-size:15.5px;line-height:1.5;padding:4px 6px;white-space:pre-wrap;max-height:160px;overflow:hidden}
.gcomp .row{display:flex;align-items:center;gap:6px}
.gcomp.one{flex-direction:row;align-items:center;border-radius:999px;padding:8px 10px}
.gcomp.one .tx{flex:1}
.gcb{height:34px;min-width:34px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:var(--g-sub);font-size:13.5px}
.gcb:hover{background:var(--g-hover)}
.gcb.on{color:var(--g-blue);background:rgba(78,156,245,.12)}
.gcb.chip{border:1px solid var(--g-line)}
.gsend{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--g-acc);color:#fff}
.app.acc-default .gsend{color:var(--g-btnfg);background:var(--g-btn)}
.gsend.off{opacity:.4}
.gsugg{display:flex;flex-direction:column;gap:2px;width:740px}
.gsugg div{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--g-sub);font-size:14px}
.gsugg div:hover{background:var(--g-hover)}
.caret:after{content:"";display:inline-block;width:1.5px;height:1.1em;background:var(--g-ink);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.menu{position:absolute;background:var(--g-menu);border:1px solid var(--g-line);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.4);padding:6px;z-index:20;min-width:220px}
.app.light .menu{box-shadow:0 10px 30px rgba(0,0,0,.12)}
.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--g-ink)}
.mi:hover,.mi.hl{background:var(--g-hover)}
.mi .ic{color:var(--g-sub)}
.mi small{display:block;color:var(--g-faint);font-size:12px;margin-top:1px}
.mi .r{margin-left:auto;color:var(--g-faint);display:flex;align-items:center;gap:6px;font-size:12.5px}
.msep{height:1px;background:var(--g-line);margin:5px 6px}
.mh{font-size:12.5px;color:var(--g-faint);padding:6px 10px 3px}
.tog{width:32px;height:19px;border-radius:10px;background:#5a5a5a;position:relative;flex:none}
.app.light .tog{background:#cfcfcf}
.tog:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:var(--g-blue)}
.tog.on:after{left:15px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;display:grid;place-items:center}
.app.light .scrim{background:rgba(0,0,0,.25)}
.gmodal{background:var(--g-bg);border:1px solid var(--g-line);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.45);width:560px;padding:22px;display:flex;flex-direction:column;gap:14px}
.app:not(.light) .gmodal{background:#2A2A2A}
.gmodal h2{font-size:18px;font-weight:600;margin:0;display:flex;justify-content:space-between;align-items:center}
.gmodal p{margin:0;color:var(--g-sub);font-size:13.5px;line-height:1.5}
.gset{width:880px;height:600px;display:flex;flex-direction:row;align-items:stretch;padding:0;gap:0;overflow:hidden}
.gset .nav{width:220px;padding:14px 10px;display:flex;flex-direction:column;gap:1px;border-right:1px solid var(--g-line)}
.gset .nav .gi{font-size:13.5px;padding:6px 10px}
.gset .pane{flex:1;padding:18px 26px;overflow:auto;display:flex;flex-direction:column}
.gset .pane h3{font-size:17px;font-weight:600;margin:4px 0 10px}
.gset .pane h4{font-size:14px;font-weight:600;margin:16px 0 4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:12px 0;border-bottom:1px solid var(--g-line);font-size:14px}
.srow small{display:block;color:var(--g-faint);font-size:12.5px;margin-top:2px;line-height:1.4;max-width:470px}
.srow .val{display:flex;align-items:center;gap:6px;color:var(--g-ink);font-size:13.5px;white-space:nowrap}
.gfld{background:var(--g-input);border:1px solid var(--g-line);border-radius:10px;padding:9px 12px;font-size:13.5px;min-height:38px;display:flex;align-items:center;gap:8px}
.gfld.area{min-height:76px;align-items:flex-start;line-height:1.5}
.gfld.focus{border-color:var(--g-faint)}
.ph{color:var(--g-faint)}
.fl{font-size:13px;color:var(--g-sub);margin:10px 0 6px}
.gfootbtns{display:flex;justify-content:flex-end;gap:8px;padding-top:12px}
.thread{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:22px;padding:14px 0 10px}
.msgu{width:740px;max-width:calc(100% - 48px);display:flex;justify-content:flex-end}
.msgu div{background:var(--g-bub);color:var(--g-bubfg);border-radius:20px;padding:10px 16px;max-width:520px;font-size:14.5px;line-height:1.5}
.msga{width:740px;max-width:calc(100% - 48px);font-size:15px;line-height:1.65;color:var(--g-ink)}
.msga p{margin:0 0 10px}
.msga ul,.msga ol{margin:0 0 10px;padding-left:22px}
.msga h4{font-size:17px;margin:4px 0 8px}
.msga .meta{font-size:13px;color:var(--g-faint);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.acts{display:flex;gap:12px;color:var(--g-faint);margin-top:2px}
.bottomc{padding:0 0 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.disc{font-size:12px;color:var(--g-faint)}
.gpage{flex:1;padding:24px 60px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.gpage h1{font-size:24px;font-weight:600;margin:0}
.gcard{background:var(--g-card);border:1px solid var(--g-line);border-radius:16px;padding:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pill{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--g-sel);color:var(--g-sub)}
.pill.g{background:rgba(34,160,107,.18);color:#4cc38a}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#0D0D0D;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;display:flex;gap:8px;align-items:center;border:1px solid #333}
.code{font-family:var(--f-mono);font-size:12.5px}
.focus{outline:none}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.radio i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--g-faint);margin-top:2px;flex:none}
.radio i.on{border:5px solid var(--g-blue)}
.rpanel{width:280px;padding:14px;display:flex;flex-direction:column;gap:10px;flex:none}
.rpanel .gcard{padding:12px;font-size:13px}
.rpanel .gcard b{display:flex;justify-content:space-between;align-items:center;font-weight:500;margin-bottom:8px;color:var(--g-sub)}
.qcard{background:var(--g-card);border:1px solid var(--g-line);border-radius:16px;padding:12px}
.qo{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;font-size:14px}
.qo:hover{background:var(--g-hover)}
.dwin{flex:1;display:flex;flex-direction:column;min-width:0}
.dbar{height:38px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--g-side);flex:none;position:relative}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
/* full-screen mode: Claude fills the screen, coach becomes a side panel */
.fsb{white-space:nowrap}
body.fs{padding-block:8px}
body.fs .top{margin-bottom:8px;gap:8px}
body.fs .brand small, body.fs .tag{display:none}
body.fs .brand b{font-size:16px}
body.fs .top .mobile-pick{display:block;width:auto;max-width:280px;padding:7px 9px}
body.fs .wb{grid-template-columns:1fr;max-width:none}
body.fs .rail{display:none}
body.fs .main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;align-items:start}
body.fs .stagewrap{grid-column:1;grid-row:1}
body.fs .coach{grid-column:2;grid-row:1;grid-template-columns:1fr;overflow:auto;padding:14px}
body.fs .coach .btns{justify-content:flex-start}
body.fs .coach h2{font-size:18px}
body.fs.nocoach .main{grid-template-columns:minmax(0,1fr) 54px}
body.fs.nocoach .coach > div:first-child, body.fs.nocoach .coach .bar{display:none}
body.fs.nocoach .coach{padding:8px}
body.fs.nocoach .coach .btns{flex-direction:column;align-items:center}
body.fs.nocoach .coach .btns .b span{display:none}
.coach .cbt{display:none}
body.fs .coach .cbt{display:inline-flex}
@media (max-width:900px){ body.fs .main{grid-template-columns:1fr} body.fs .coach{grid-column:1;grid-row:2} }
@media (prefers-reduced-motion:reduce){.ring,.ring.pulse,.flash{animation:none;transition:none}}

</header>

<div class="wb">

</div>
<script>

/* ================= icons ================= */
const P = {

  play:'<path d="M8 5l11 7-11 7z"/>', refresh:'<path d="M20 11a8 8 0 1 0-2 5.3"/><path d="M20 5v6h-6"/>',

const I = (n, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hs = id => `data-hs="${id}"`;

/* ================= ChatGPT components ================= */
const G = {};
G.tx = (v, ph, active) => v ? `<span class="${active?'caret':''}">${esc(v)}</span>` : (active ? `<span class="caret"></span><span class="ph">${esc(ph||'')}</span>` : `<span class="ph">${esc(ph||'')}</span>`);
G.side = (o={}) => {
  const a = o.active||'';
  const it = (id, ic, l, extra='') => `<div class="gi ${a===id?'on':''}" ${hs('side-'+id)}><span class="ic">${I(ic)}</span>${l}${extra}</div>`;
  const pinned = o.pinned||[], rec = o.recents||[];
  return `<aside class="gs">
   <div class="hd">ChatGPT<span><span class="ic" ${hs('side-search')}>${I('search')}</span><span class="ic" ${hs('side-toggle')}>${I('panel')}</span></span></div>
   ${it('new','edit','New chat')}${it('images','image','Images','<span class="tagu">UPDATED</span>')}${it('library','library','Library')}${it('scheduled','clock','Scheduled')}${it('plugins','grid','Plugins')}${it('projects','folder','Projects')}${it('codex','code','Codex')}${it('more','more','More')}
   ${o.moreOpen?`<div style="padding-left:14px">${it('gpts','sparkle','GPTs')}${it('sites','globe2','Sites')}${it('business','chart','Business Hub')}</div>`:''}
   ${pinned.length?`<div class="sh">Pinned</div>${pinned.map((p,i)=>`<div class="rc ${o.curPin===i?'on':''}" ${hs('pin-'+i)}><span class="tt" style="display:flex;gap:8px;align-items:center">${p.proj?`<span class="ic" style="color:#E8702A">${I('folder')}</span>`:''}${esc(p.t||p)}</span></div>`).join('')}`:''}
   <div class="sh">Recents</div>${rec.length?rec.map((r,i)=>`<div class="rc ${o.cur===i?'on':''}" ${hs('rec-'+i)}><span class="tt">${esc(r)}</span>${o.cur===i&&o.dots?`<span class="ic" ${hs('x-rdots')}>${I('dots')}</span>`:''}</div>`).join(''):`<div class="empty">No chats yet</div>`}
   <div class="gfoot"><div class="u" ${hs('side-user')}><div class="gav"></div><div><b>${o.name||'Carter Surach'}</b><small>${o.plan||'Free'}</small></div></div>${(o.plan||'Free')==='Free'?`<div class="gclaim" ${hs('claim')}>${I('gift')} Claim offer</div>`:''}</div>
  </aside>`;
};
G.top = (o={}) => `<div class="gtop">${o.title?`<div class="ttl" ${o.titleHs?hs(o.titleHs):''}>${o.title} ${I('chev')}</div>`:''}
  ${o.noMid?'':`<div class="mid"><span class="${o.work?'':'on'}" ${hs('top-chat')}>Chat</span><span class="${o.work?'on':''}" ${hs('top-work')}>+ Work</span></div>`}
  <div class="r">${(o.plan||'Free')==='Free'&&!o.noOffer?`<span class="offer" ${hs('top-offer')}>${I('gift')} Free offer</span>`:''}${o.share?`<span class="gbtn sm" ${hs('top-share')}>${I('share2')} Share</span><span class="ic" ${hs('top-dots')} style="color:var(--g-sub)">${I('more')}</span>`:''}${o.right||''}</div></div>`;
// composer
G.comp = (o={}) => {
  const v = o.text||'';
  const tail = v ? `<span class="gsend" ${hs(o.sendHs||'send')}>${I('up')}</span>` : `<span class="gcb" ${hs('mic')}>${I('mic')}</span><span class="gsend" ${hs('voice')}>${I('wave')}</span>`;
  const think = `<span class="gcb ${o.think?'on':''}" ${hs('think')}>${I('bulb2')} ${o.think?o.think:'Think'}</span>`;
  const chips = (o.chips||[]).map(c=>`<span class="gcb on">${c}</span>`).join('');
  const files = o.files ? `<div style="display:flex;gap:8px;padding:4px 4px 2px">${o.files.map(f=>`<div style="background:var(--g-sel);border-radius:12px;padding:8px 10px;font-size:12px;display:flex;gap:8px;align-items:center">${I('doc')}${esc(f)}</div>`).join('')}</div>` : '';

function scale(){
  const w = $('stagewrap').clientWidth;
  const fs = document.body.classList.contains('fs');
  const maxH = fs ? Math.max(320, window.innerHeight - document.querySelector('.top').offsetHeight - 26) : Math.max(360, window.innerHeight - 170);
  const s = Math.min(w/1280, maxH/800);
  $('scaler').style.transform = `scale(${s})`;
  $('scaler').style.left = ((w - 1280*s)/2) + 'px';
  $('stagewrap').style.height = (800*s) + 'px';
  placeRing();
}

function render(){
  if (S.mode==='explore') { X.render(); addPanelToggle(); return; }
  const s = sc();
  const app = $('app');
  if (S.finished) {
    const e = s.end;
    app.className = 'app ' + (e.theme || s.theme);
    app.innerHTML = e.view();
  } else {
    const step = st();
    app.className = 'app ' + (step.theme || s.theme);
    app.innerHTML = step.view({typed:S.typed, active:S.typing || (S.mode==='watch' && step.type==='type' && S.typed.length>0), picked:S.picked});
  }
  revealTarget();
  placeRing();
  coach(); addPanelToggle();
}

function revealTarget(){
  const el = targetEl(); const th = $('app').querySelector('.thread');
  if (th && !(el && th.contains(el))) th.scrollTop = th.scrollHeight;
  if (!el) return;
  const box = el.closest('#x-spane, .thread, .gpage, .pane');
  if (!box || box.scrollHeight <= box.clientHeight + 2) return;
  const k = $('app').getBoundingClientRect().width / 1280 || 1;
  const er = el.getBoundingClientRect(), br = box.getBoundingClientRect();
  const off = (er.top - br.top) / k, h = er.height / k;
  if (off < 8 || off + h > box.clientHeight - 8) box.scrollTop += off - box.clientHeight/2 + h/2;
}
function targetEl(){
  if (S.finished) return null;
  return $('app').querySelector(`[data-hs="${st().hs}"]`);
}
function showRing(){
  if (S.finished || S.mode==='explore') return false;
  if (S.mode==='watch' || S.mode==='try') return true;
  return S.wrong >= 3;
}
function placeRing(){
  const ring = $('ring'), bub = $('bubble');
  const el = targetEl();
  if (!el || !showRing()) { ring.hidden = true; bub.hidden = true; return; }
  const wr = $('stagewrap').getBoundingClientRect(), r = el.getBoundingClientRect();
  const pad = 5;
  ring.hidden = false;
  ring.className = 'ring ' + (S.mode==='watch' ? 'pulse' : 'soft');
  Object.assign(ring.style, {left:(r.left-wr.left-pad)+'px', top:(r.top-wr.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px'});
  // bubble with the short instruction
  const step = st(); const txt = L(step).t;
  if (!txt || S.mode==='test') { bub.hidden = true; return; }
  bub.hidden = false; bub.textContent = txt; bub.dir = S.lang==='ar' ? 'rtl' : 'ltr';
  const bw = Math.min(300, wr.width - 24); bub.style.maxWidth = bw + 'px';
  const bh = bub.offsetHeight, bwid = bub.offsetWidth;
  let x = r.left - wr.left + r.width/2 - bwid/2;
  x = Math.max(8, Math.min(x, wr.width - bwid - 8));
  let y = r.bottom - wr.top + 12;
  if (y + bh > wr.height - 6) y = r.top - wr.top - bh - 12;
  if (y < 6) y = Math.min(wr.height - bh - 6, r.bottom - wr.top + 12);
  bub.style.left = x + 'px'; bub.style.top = y + 'px';
}

function btn(label, cls, fn, icon){ const b = document.createElement('button'); b.className = 'b ' + (cls||''); b.innerHTML = (icon?I(icon):'') + `<span>${label}</span>`; b.onclick = fn; return b; }

  const b = btn(hid?u.showTips:u.hideTips, 'cbt', () => { document.body.classList.toggle('nocoach'); render(); requestAnimationFrame(scale); }, hid?(S.lang==='ar'?'right':'left'):(S.lang==='ar'?'left':'right')); b.title = hid?u.showTips:u.hideTips; $('c-btns').prepend(b); }

    note.innerHTML = `<b style="color:${e.pass?'var(--ok)':'var(--bad)'}">${e.pass?u.passT:u.failT}</b>` + (e.items.length?`<ul style="margin:6px 0 0;padding:0;display:grid;gap:3px;list-style:none">${e.items.map(it=>`<li>${it.ok?'✅':'⬜'} ${esc(it.label)}${it.note?` <span style="opacity:.75">— ${esc(it.note)}</span>`:''}</li>`).join('')}</ul>`:'') + (e.tip?`<div style="margin-top:6px">${esc(e.tip)}</div>`:'') + `<div style="margin-top:6px;font-size:11px;opacity:.7">${e.ai?u.aiBy:u.rulesBy}${e.items.length?' · '+e.score+'%':''}</div>` + (!e.pass && S.mode==='try' ? `<div style="margin-top:4px;font-size:12px;opacity:.8">${u.mineNote}</div>` : ''); }

  } else {
    if (step.type==='type' && S.typing && !S.evBusy) { if (S.ev && S.ev.pass) B.append(btn(u.cont, 'pri', () => advance(), S.lang==='ar'?'left':'right')); else B.append(btn(u.check, 'pri', () => checkTyped(), 'check'));
      if (S.mode==='try' && !(S.ev && S.ev.pass)) B.append(btn(u.modelAns, '', () => { S.typed = st().text; S.assisted = true; S.ev = null; $('kbd').value = S.typed; render(); }, 'zap'));
      if (S.mode==='try' && S.ev && !S.ev.pass && !S.assisted) B.append(btn(u.mineOK, '', () => { S.overrides = (S.overrides||0) + 1; advance(); }, 'check'));
      if (S.mode==='test' && S.checks >= 2 && !(S.ev && S.ev.pass)) B.append(btn(u.contAnyway, '', () => advance(), S.lang==='ar'?'left':'right')); }
    if (step.type==='choice' && S.fb && (S.fb.ok || S.mode==='test')) B.append(btn(u.cont, 'pri', () => advance(), S.lang==='ar'?'left':'right'));
    if (S.mode==='test' && S.wrong>0 && S.wrong<3) B.append(btn(u.show, '', () => { S.wrong = 3; render(); }, 'help'));
    B.append(btn(u.restart, '', () => start(S.sc), 'refresh'));

}

function flashAt(x, y, bad){
  const f = document.createElement('div'); f.className = 'flash' + (bad?' bad':'');
  f.style.left = x + 'px'; f.style.top = y + 'px'; $('stagewrap').append(f); setTimeout(() => f.remove(), 520);
}
function flashTarget(){
  const el = targetEl(); if (!el) return;
  const wr = $('stagewrap').getBoundingClientRect(), r = el.getBoundingClientRect();
  flashAt(r.left - wr.left + r.width/2, r.top - wr.top + r.height/2);
}

function advance(){
  const s = sc();
  if (S.wrong === 0 && !s.steps[S.i].branch) S.firstOK++;
  S.wrong = 0; S.typed = ''; S.typing = false; S.picked = null; S.fb = null; S.ev = null; S.checks = 0; S.assisted = false;
  let j = S.i + 1; while (j < s.steps.length && s.steps[j].branch) j++;
  if (j < s.steps.length) { S.i = j; render(); }
  else finish();
}
const critKey = step => step.crit && (typeof step.crit==='string' ? step.crit : Object.keys(CRIT).find(k => CRIT[k][0]===step.crit.en));
function choose(op){
  const step = st(), s = sc(), k = critKey(step);
  S.picked = op.id; const best = op.pts >= step.max;
  if (k && S.crit[k] == null) S.crit[k] = op.pts;
  if (!best) { S.wrong++; S.errs++; }
  S.fb = {ok:best, text:L(op.fb) + (best || S.mode==='test' ? '' : ' ' + UI[S.lang].tryAgainDecide)};
  if (op.go && S.mode!=='watch') { const j = s.steps.findIndex(x=>x.id===op.go); if (j>=0) { S.i = j; S.picked = null; S.fb = null; } }
  render();
}
function back(){ if (S.i>0 && !S.busy) { S.i--; S.typed=''; S.typing=false; render(); } }

function perform(){
  if (S.busy || S.finished) return;
  const step = st();
  if (step.type === 'choice') { if (!S.fb) { const op = step.opts.reduce((a,b)=>b.pts>a.pts?b:a); S.picked = op.id; S.fb = {ok:true, text:L(op.fb)}; render(); } else advance(); return; }
  if (step.type === 'type') {
    S.busy = true; S.typing = true; const full = step.text; let k = 0;
    const chunk = Math.max(1, Math.ceil(full.length / 45));
    const tick = () => { k = Math.min(full.length, k + chunk); S.typed = full.slice(0, k); render();
      if (k < full.length) setTimeout(tick, 28); else setTimeout(() => { S.busy = false; advance(); }, 450); };
    tick();
  } else {
    flashTarget(); S.busy = true; setTimeout(() => { S.busy = false; advance(); }, 380);
  }
}

/* Arabic: unify letter forms so "أريد/اريد", "ة/ه", "ى/ي" match, and map Egyptian/Gulf colloquial words to the standard words the criteria look for */
const normAr = t => (t||'').replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي');

  [/الداتا|الشيت|الاكسل|اكسيل|الفايل|المرفق|اللي باعته|اللي مرفق/, 'البيانات الملف المرفق'],
  [/فيديوهات|فيديو|الحلقات|حلقه/, 'فيديو'],
  [/افكار|فكره|ايديا/, 'افكار'],

  [/حلل(لي)?|افحص|ادرس/, 'حلل'],
  [/توصيات|نصايح|نصائح|حلول|اعمل ايه|نعمل ايه|الحل/, 'توصيات حل'],
  [/عناوين|عنوان|تايتل/, 'عنوان'],
  [/جدول|تابل|تيبل/, 'جدول'],

  [/بشتغل|شغلي|شغلانتي|وظيفتي|شغال/, 'اعمل عمل'],
  [/كل يوم|يوميا|يومي|كل صباح/, 'كل يوم'],
  [/الصبح|صباحا|بدري|الساعه \d/, 'صباح'],
  [/افتكر|احفظ|خلي في بالك|متنساش|ماتنساش|سجل/, 'تذكر احفظ'],

const augment = t => { const n = normAr(t); let extra = ''; COLLOQ.forEach(([re, add]) => { if (re.test(n)) extra += ' ' + add; }); return n + ' ' + extra; };

function ruleEval(step, text){
  const c = step.check || {}, t = (text||'').trim(), lang = S.lang==='ar' ? 1 : 0;
  if (c.free) return {pass: t.length >= (c.min||1), score: t.length >= (c.min||1) ? 100 : 0, items: []};
  const key = c.key || (!c.items && step.text.trim().length <= 40 ? step.text.trim() : null);
  if (key) { const ok = norm(t).includes(norm(key)); return {pass: ok, score: ok?100:0, items: ok?[]:[{label:(lang?'اكتب: ':'Type: ') + key, ok:false}]}; }

  const items = (c.items||[]).map(r => ({label:r[lang], ok: r[2].test(t) || arRe(r[2]).test(aug)}));
  const longOK = t.length >= (c.min||0);
  if (!longOK) items.push({label: lang ? `أطول قليلًا: ${c.min} حرفًا على الأقل` : `A little longer: at least ${c.min} characters`, ok:false});

async function aiEval(step, text){

  const crit = c.items.map((r,i) => `${i+1}. ${r[0]}`).join('\n');
  const prompt = `You are a strict but encouraging trainer grading what a learner typed in a ChatGPT training simulation.\nScenario: ${L(s.title)}. Task for this step: ${L(step).t || ''}. ${L(step).s || ''}\nCriteria:\n${crit}\nA model answer for reference (the learner does NOT need to match it):\n<<<${step.text.trim()}>>>\nLearner's text:\n<<<${text.trim().slice(0,3000)}>>>\nGrade each criterion as met or not, judging meaning, not keywords. The learner may write in Arabic or English.\nReply with only JSON: {"score": 0-100, "criteria": [{"met": true|false, "note": "max 12 words"}], "tip": "one sentence on the single most useful improvement"}. Write notes and tip in ${lang?'Arabic':'English'}.`;
  const r = await AI.sample.json(prompt, {modelTier:'quick', cache:false});
  if (!r || !Array.isArray(r.criteria)) throw {code:'invalid_json'};
  const items = c.items.map((it,i) => ({label: it[lang?1:0], ok: !!(r.criteria[i] && r.criteria[i].met), note: r.criteria[i] && r.criteria[i].note}));

  const met = items.filter(i=>i.ok).length;
  return {pass: score >= 60 && text.trim().length >= (c.min||0)*0.6 && met >= Math.min(c.need ?? items.length, items.length) - 1, score, items, tip: String(r.tip||''), ai:true};
}
async function checkTyped(){
  const step = st(); if (step.type!=='type' || S.evBusy) return;
  if (!S.typed.trim()) return;
  S.checks++;
  let ev = null;
  if (step.check && step.check.ai && AI.sample && !AI.off) {
    S.evBusy = true; render();
    try { ev = await aiEval(step, S.typed); }
    catch(e) { if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e && e.code)) AI.off = true; ev = null; }
    S.evBusy = false;
  }
  if (!ev) ev = ruleEval(step, S.typed);
  if (S.assisted) ev.score = Math.min(ev.score, 50);
  S.ev = ev;
  const k = critKey(step);
  if (S.checks === 1) { if (step.check && step.check.items) S.qual.push(ev.score); if (k && S.crit[k]==null) S.crit[k] = Math.round(ev.score/100 * CRIT[k][2]); }

  if (!ev.items.length && !ev.tip) { render(); setTimeout(advance, 300); return; }
  render();
}
function finishType(){ checkTyped(); }

$('app').addEventListener('click', e => {
  if (S.mode==='explore') { X.click(e); return; }
  if (S.busy || S.finished) return;
  const step = st();
  if (step.type === 'choice') { const o = e.target.closest('[data-hs^="dc-"]'); const id = o && o.dataset.hs.slice(3);
    if (S.mode === 'watch') { perform(); return; }
    const op = step.opts.find(x => x.id === id); if (!op) return;
    if (S.fb && (S.fb.ok || S.mode==='test')) return;
    choose(op); return; }
  if (step.type === 'info') { if (e.target.closest('[data-hs="dc-ok"]')) { const j = sc().steps.findIndex(x=>x.id===step.back); S.i = j>=0 ? j : S.i; S.picked = null; S.fb = null; render(); } return; }
  const hit = e.target.closest(`[data-hs="${step.hs}"]`);
  const wr = $('stagewrap').getBoundingClientRect();
  if (S.mode === 'watch') { if (hit) perform(); return; }
  if (hit) {
    if (step.type === 'type') {
      if (!S.typing) { S.typing = true; render(); }
      const k = $('kbd'); k.value = S.typed; k.focus({preventScroll:true});
      return;
    }
    flashAt(e.clientX - wr.left, e.clientY - wr.top);
    S.busy = true; setTimeout(() => { S.busy = false; advance(); }, 220);
  } else {
    S.wrong++; S.errs++;
    flashAt(e.clientX - wr.left, e.clientY - wr.top, true);
    const w = $('stagewrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
    render();
  }
});
$('kbd').addEventListener('keydown', e => {
  if (S.mode==='explore') { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); X.enter(); } return; }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (S.typing) { if (S.ev && S.ev.pass) advance(); else checkTyped(); } return; }
});
$('kbd').addEventListener('input', e => { if (S.mode==='explore') { X.input(); return; }
  if (!S.typing || S.mode==='watch' || st().type!=='type') { $('kbd').value = ''; return; }
  S.typed = $('kbd').value.slice(0, 4000); S.assisted = false; if (S.ev && !S.evBusy) S.ev = null; render(); });

function finish(){
  const s = sc(); S.finished = true;
  const p = prog[s.id] = prog[s.id] || {};
  const nVis = s.steps.filter(x=>!x.branch).length;
  p[S.mode] = S.mode==='test' ? (s.competency ? compTotal() : Math.round(S.firstOK / nVis * 100)) : true;
  saveProg(); rail(); render(); doneCard();
}
const compTotal = () => Object.keys(CRIT).reduce((a,k) => a + (S.crit[k]||0), 0);
function doneCard(){
  const u = UI[S.lang], s = sc(); const old = $('stagewrap').querySelector('.done'); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'done'; d.dir = S.lang==='ar' ? 'rtl' : 'ltr';
  const secs = Math.round((Date.now() - S.t0)/1000), mm = Math.floor(secs/60), ss = String(secs%60).padStart(2,'0');
  let body = '';
  const nVis = s.steps.filter(x=>!x.branch).length;
  const qavg = S.qual.length ? Math.round(S.qual.reduce((a,b)=>a+b,0)/S.qual.length) : null;
  if (s.competency && S.mode !== 'watch') {
    const tot = compTotal();
    body = `<div class="k" style="color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em">${u.compT}</div>
      <div class="big" style="color:${tot>=80?'var(--ok)':tot>=60?'var(--hot)':'var(--bad)'}">${tot}/100</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 4px"><tr style="color:var(--muted)"><th style="text-align:start;padding:4px">${u.crit}</th><th style="padding:4px">${u.weight}</th><th style="padding:4px">${u.earned}</th></tr>${Object.keys(CRIT).map(k=>{ const e = S.crit[k]||0, w = CRIT[k][2]; return `<tr style="border-top:1px solid var(--line)"><td style="padding:5px 4px;text-align:start">${CRIT[k][S.lang==='ar'?1:0]}</td><td style="padding:5px 4px;text-align:center">${w}</td><td style="padding:5px 4px;text-align:center;font-weight:600;color:${e>=w*0.8?'var(--ok)':e>=w*0.5?'var(--hot)':'var(--bad)'}">${e}</td></tr>`; }).join('')}</table>`;
  } else if (S.mode === 'test') {
    const pct = Math.round(S.firstOK / nVis * 100);
    body = `<div class="k" style="color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em">${u.doneTest}</div>
      <div class="big" style="color:${pct>=80?'var(--ok)':pct>=50?'var(--hot)':'var(--bad)'}">${pct}%</div>
      <div class="stats"><div><b>${S.firstOK}/${nVis}</b>${u.firstTry}</div>${qavg!=null?`<div><b>${qavg}%</b>${u.quality}</div>`:''}<div><b>${S.errs}</b>${u.errors}</div><div><b>${mm}:${ss}</b>${u.time}</div></div>`;
  } else {
    body = `<h2>${u.doneT}</h2><p>${S.mode==='watch'?u.doneWatch:u.doneTry}</p>`;
  }
  d.innerHTML = `<div class="card">${body}<div class="row"></div></div>`;
  const row = d.querySelector('.row');
  row.append(btn(u.again, '', () => start(S.sc), 'refresh'));
  if (S.mode==='watch') row.append(btn(u.toTry, 'pri', () => setMode('try')));
  if (S.mode==='try') row.append(btn(u.toTest, 'pri', () => setMode('test')));
  if (S.sc < SCN.length-1) row.append(btn(u.nextSc, S.mode==='test'?'pri':'', () => start(S.sc+1), S.lang==='ar'?'left':'right'));
  $('stagewrap').append(d);
}

function start(k){
  S.sc = k; S.i = 0; S.typed = ''; S.typing = false; S.busy = false; S.wrong = 0; S.errs = 0; S.firstOK = 0; S.finished = false; S.t0 = Date.now(); S.picked = null; S.fb = null; S.ev = null; S.evBusy = false; S.checks = 0; S.qual = []; S.crit = {}; S.assisted = false;
  const old = $('stagewrap').querySelector('.done'); if (old) old.remove();
  if (S.mode==='explore') X.goto(SCN[k].id);
  rail(); render(); scale();
}
function setMode(m){ S.mode = m; savePref(); document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode===m)); start(S.sc); }
function setLang(l){
  S.lang = l; savePref();
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang===l));
  const u = UI[l];
  fsLabel();
  $('t-brand').textContent = u.brand; $('t-sub').textContent = u.sub; $('t-tag').textContent = u.tag;
  document.querySelectorAll('#modes button').forEach(b => b.querySelector('span').textContent = u[b.dataset.mode]);
  document.querySelector('.top .brand').dir = l==='ar'?'rtl':'ltr';
  $('rail').dir = l==='ar'?'rtl':'ltr'; $('rail').lang = l;
  rail(); render();
  if (S.finished) doneCard();
}
function rail(){
  const u = UI[S.lang]; const r = $('rail'); let html = `<h3>${u.chapters}</h3>`; let g = '';
  const mp = $('mpick'); mp.innerHTML = ''; mp.dir = S.lang==='ar'?'rtl':'ltr';
  SCN.forEach((s, k) => {
    if (s.group !== g) { g = s.group; html += `<div class="grp">${u.groups[g]}</div>`; }
    const p = prog[s.id] || {};
    html += `<button class="ch" data-k="${k}" aria-current="${k===S.sc}"><span class="n">${k+1}</span><span class="t">${esc(L(s.title))}<small>${s.steps.filter(x=>!x.branch).length} ${S.lang==='ar'?'خطوات':'steps'}${s.competency?(S.lang==='ar'?' · تقييم كفاءة':' · scored'):''}</small></span><span class="st"><i class="${p.watch?'on':''}"></i><i class="${p.try?'on':''}"></i><i class="${p.test!=null?'on':''}" title="${p.test!=null?p.test+'%':''}"></i></span></button>`;
    const o = document.createElement('option'); o.value = k; o.textContent = `${k+1}. ${L(s.title)}`; if (k===S.sc) o.selected = true; mp.append(o);
  });
  html += `<div class="legend">${u.legend}<br>${u.uiNote}</div>`;
  r.innerHTML = html;
  r.querySelectorAll('.ch').forEach(b => b.onclick = () => start(+b.dataset.k));
}
$('mpick').onchange = e => start(+e.target.value);
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('#langs button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.addEventListener('keydown', e => {
  if (e.target === $('kbd')) return;
  if (S.mode==='watch' && (e.key==='ArrowRight' || e.key===' ')) { if (e.target.tagName!=='BUTTON') { e.preventDefault(); perform(); } }
  if (S.mode==='watch' && e.key==='ArrowLeft') back();
});
/* full screen */
function fsLabel(){ const on = document.body.classList.contains('fs'); $('fsbtn').querySelector('span').textContent = UI[S.lang][on?'fsOff':'fs'];
  $('fsbtn').querySelector('svg').innerHTML = on ? '<path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>' : '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>'; }
function setFs(on){
  const b = document.body, top = document.querySelector('.top'), mp = $('mpick');
  b.classList.toggle('fs', on);
  if (on) top.insertBefore(mp, $('modes')); else document.querySelector('.main').insertBefore(mp, $('stagewrap'));
  try { if (on && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
        if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); } catch(e) {}
  fsLabel(); render(); requestAnimationFrame(scale); setTimeout(scale, 250); }
$('fsbtn').onclick = () => setFs(!document.body.classList.contains('fs'));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('fs')) setFs(false); });
document.addEventListener('keydown', e => { if (e.target === $('kbd')) return; if ((e.key==='f'||e.key==='F') && !e.ctrlKey && !e.metaKey && e.target.tagName!=='INPUT' && e.target.tagName!=='SELECT') setFs(!document.body.classList.contains('fs')); });
new ResizeObserver(scale).observe($('stagewrap'));
window.addEventListener('resize', scale);
document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode===S.mode));
setLang(S.lang);
start(0);
document.fonts && document.fonts.ready.then(placeRing);
</script>

</body></html>
